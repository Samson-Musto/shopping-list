<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Shopping List</h1>

    <p class="description">
        Organize your shopping, track your purchases, and calculate your total cost easily.
    </p>
    <div> 
        <input id="itemInput" type="text" placeholder="Enter item name">

        <input id="priceInput" type="number" min="0" step="0.01" placeholder="Price (ksh)">

    <button id="addButton">Add item</button>
    <ul id="shoppingList"></ul>
    <h2 id="totalCost">Total cost: Ksh0.00</h2>
    <button id="clearButton">Clear List</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
